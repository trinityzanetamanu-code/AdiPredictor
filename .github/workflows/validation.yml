name: Code Validation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - 'public/predictions/**'
      - 'public/patterns/**'
      - 'public/app-release.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Install Python test dependencies
        run: pip install requests beautifulsoup4 pytest
      - name: Run full Python suite including signed release guards
        run: python -m pytest -q
      - name: Test JavaScript and LiveDraw
        run: npm run test:live
      - name: Build web assets
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify controlled foreground synchronization
        run: node scripts/check_foreground_sync.mjs
      - name: Verify Android diagnostic capture with controlled DOM
        run: node scripts/check_hk_diagnostic.mjs
      - name: Verify prediction history and archived visual SVGs at Android viewport
        run: node scripts/check_history_visuals.mjs
