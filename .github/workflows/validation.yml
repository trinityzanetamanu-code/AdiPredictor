name: Code Validation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - 'public/predictions/**'
      - 'public/patterns/**'
      - 'public/app-release.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # parity inputs remain pinned even if collector advances main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.16+8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build isolated JVM engine and run Kotlin regressions
        run: ./kotlin/gradlew -p kotlin --no-daemon test :cli:installDist
      - name: Live frozen-input Python versus Kotlin full engine comparison
        run: python kotlin/parity/compare.py --output kotlin/parity-runs/ci
      - name: Upload parity paths, runtime measurements and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-python-parity-${{ github.sha }}
          if-no-files-found: warn
          path: |
            kotlin/parity-runs/ci/report.*
            kotlin/parity-runs/ci/inputs/manifest.json
            kotlin/parity-runs/ci/inputs/tie-evidence.json
            kotlin/parity-runs/ci/public-before.json
            kotlin/parity-runs/ci/public-after.json
            kotlin/parity-runs/ci/python/runtimes.json
            kotlin/parity-runs/ci/kotlin/runtimes.json
            kotlin/core/build/test-results/test/
            kotlin/core/build/reports/tests/test/
  code-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Install Python test dependencies
        run: pip install requests beautifulsoup4 pytest
      - name: Run full Python suite including signed release guards
        run: python -m pytest -q
      - name: Test JavaScript and LiveDraw
        run: npm run test:live
      - name: Build web assets
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify controlled foreground synchronization
        run: node scripts/check_foreground_sync.mjs
      - name: Verify Android diagnostic capture with controlled DOM
        run: node scripts/check_hk_diagnostic.mjs
      - name: Verify prediction history and archived visual SVGs at Android viewport
        run: node scripts/check_history_visuals.mjs
