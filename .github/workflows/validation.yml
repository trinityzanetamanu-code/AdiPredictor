name: Code Validation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - 'public/predictions/**'
      - 'public/patterns/**'
      - 'public/app-release.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Install Python test dependencies
        run: pip install requests beautifulsoup4 pytest
      - name: Run full Python suite including signed release guards
        run: python -m pytest -q
      - name: Test JavaScript and LiveDraw
        run: npm run test:live
      - name: Build web assets
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify controlled foreground synchronization
        run: node scripts/check_foreground_sync.mjs
      - name: Verify Android diagnostic capture with controlled DOM
        run: node scripts/check_hk_diagnostic.mjs

  paito-browser-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: b821eb7e333050a141a4812b34d258236f404e4f
          path: before
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix before
      - run: npx playwright install --with-deps chromium
      - name: Capture before at Android viewport
        timeout-minutes: 4
        continue-on-error: true
        env:
          PAITO_APP_DIR: ${{ github.workspace }}/before
          PAITO_OUTPUT_DIR: ${{ github.workspace }}/artifacts/paito-before
          PAITO_PORT: '5198'
          PAITO_BASELINE: '1'
        run: node scripts/capture_paito_browser.mjs
      - name: Capture after at Android viewport
        timeout-minutes: 8
        env:
          PAITO_OUTPUT_DIR: ${{ github.workspace }}/artifacts/paito-after
          PAITO_PORT: '5199'
        run: node scripts/capture_paito_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paito-viewport-before-after-${{ github.sha }}
          path: artifacts/paito-*
          if-no-files-found: error
