name: Auto Result Collector

on:
  schedule:
    # Keep the 10-minute cadence off the busiest top-of-hour boundaries.
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'scripts/collector.py'
      - 'scripts/live_board_collector.py'
      - 'scripts/hk_canonical.py'
      - 'scripts/prediction_engine.py'
      - 'scripts/publish_generated_data.sh'
      - 'scripts/run_prediction_engine.sh'
      - 'scripts/build_prediction_engine.sh'
      - 'scripts/python_prediction_production.py'
      - 'config/prediction_backend.txt'
      - 'kotlin/**'
      - 'config/collector_sources.json'
      - 'tests/**'
      - '.github/workflows/auto-scraper.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/collector.py'
      - 'scripts/live_board_collector.py'
      - 'scripts/hk_canonical.py'
      - 'scripts/prediction_engine.py'
      - 'scripts/publish_generated_data.sh'
      - 'scripts/run_prediction_engine.sh'
      - 'scripts/build_prediction_engine.sh'
      - 'scripts/python_prediction_production.py'
      - 'config/prediction_backend.txt'
      - 'kotlin/**'
      - 'config/collector_sources.json'
      - 'tests/**'
      - '.github/workflows/auto-scraper.yml'
  workflow_dispatch:
    inputs:
      market:
        description: 'Market yang ingin dicek'
        required: false
        default: 'ALL'
        type: choice
        options: [ALL, HK, SGP, SDY]

permissions:
  contents: write

concurrency:
  group: adipredictor-data-writer-main
  cancel-in-progress: false

jobs:
  collect-results:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup JVM for prediction adapter
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.16+8'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 pytest

      - name: Run Full Test Suite
        run: python -m pytest -q

      - name: Validate Collector and Engine Without Publishing
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        env:
          MARKET: ${{ github.event.inputs.market || 'ALL' }}
        run: |
          python scripts/collector.py --market "$MARKET" --strict
          bash scripts/run_prediction_engine.sh --market ALL --simulate

      - name: Publish Fresh Result and Prediction With Safe Retry
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          MARKET: ${{ github.event.inputs.market || 'ALL' }}
          INCLUDE_COLLECTOR: '1'
          PREDICTION_FORCE: '0'
          MAX_PUSH_ATTEMPTS: '3'
        run: bash scripts/publish_generated_data.sh


      - name: Upload executor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-executor-${{ github.run_id }}
          if-no-files-found: warn
          path: prediction-run-reports/
