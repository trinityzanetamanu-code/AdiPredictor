name: Auto Result Collector

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'scripts/collector.py'
      - 'scripts/prediction_engine.py'
      - 'scripts/publish_generated_data.sh'
      - 'config/collector_sources.json'
      - 'tests/**'
      - '.github/workflows/auto-scraper.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/collector.py'
      - 'scripts/prediction_engine.py'
      - 'scripts/publish_generated_data.sh'
      - 'config/collector_sources.json'
      - 'tests/**'
      - '.github/workflows/auto-scraper.yml'
  workflow_dispatch:
    inputs:
      market:
        description: 'Market yang ingin dicek'
        required: false
        default: 'ALL'
        type: choice
        options: [ALL, HK, SGP, SDY]

permissions:
  contents: write

concurrency:
  group: adipredictor-data-writer-main
  cancel-in-progress: false

jobs:
  collect-results:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 pytest

      - name: Run Full Test Suite
        run: python -m pytest -q

      - name: Validate Collector and Engine Without Publishing
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        env:
          MARKET: ${{ github.event.inputs.market || 'ALL' }}
        run: |
          python scripts/collector.py --market "$MARKET" --strict
          python scripts/prediction_engine.py --market ALL

      - name: Publish Fresh Result and Prediction With Safe Retry
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          MARKET: ${{ github.event.inputs.market || 'ALL' }}
          INCLUDE_COLLECTOR: '1'
          PREDICTION_FORCE: '0'
          MAX_PUSH_ATTEMPTS: '3'
        run: bash scripts/publish_generated_data.sh
