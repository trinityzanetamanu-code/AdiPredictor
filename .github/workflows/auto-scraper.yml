name: Auto HK Scraper Workflow

on:
  schedule:
    # Berjalan otomatis setiap 10 menit antara jam 22:00 - 23:30 WIB (15:00 - 16:30 UTC)
    - cron: '*/10 15-16 * * *'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub Actions

jobs:
  scrape-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Scraper Script
        run: python scripts/scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/hk.json
          git commit -m "chore: auto-update HK Result [skip ci]" || exit 0
          git push
