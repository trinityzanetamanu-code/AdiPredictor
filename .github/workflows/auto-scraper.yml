name: Auto Result Collector

on:
  schedule:
    # Polling ringan setiap 30 menit. Collector hanya commit bila result baru terdeteksi.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      market:
        description: 'Market yang ingin dicek'
        required: false
        default: 'ALL'
        type: choice
        options:
          - ALL
          - HK
          - SGP
          - SDY

permissions:
  contents: write

concurrency:
  group: adipredictor-result-collector
  cancel-in-progress: false

jobs:
  collect-results:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Collector Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Collect Latest Results
        env:
          MARKET: ${{ github.event.inputs.market || 'ALL' }}
        run: |
          python scripts/collector.py --market "$MARKET"

      - name: Commit New Results Only
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # collector-status.json berubah setiap pengecekan, tetapi hanya ikut commit
          # jika setidaknya satu market JSON benar-benar berubah.
          git add public/data/hk.json public/data/sgp.json public/data/sdy.json

          if git diff --cached --quiet; then
            echo "Tidak ada result baru. Tidak membuat commit."
            exit 0
          fi

          git add public/data/collector-status.json
          git commit -m "data: auto-update latest lottery results [skip ci]"
          git push
