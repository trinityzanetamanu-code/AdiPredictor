name: Auto Result Collector

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'scripts/collector.py'
      - 'config/collector_sources.json'
      - 'tests/**'
      - '.github/workflows/auto-scraper.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/collector.py'
      - 'config/collector_sources.json'
      - 'tests/**'
      - '.github/workflows/auto-scraper.yml'
  workflow_dispatch:
    inputs:
      market:
        description: 'Market yang ingin dicek'
        required: false
        default: 'ALL'
        type: choice
        options:
          - ALL
          - HK
          - SGP
          - SDY

permissions:
  contents: write

concurrency:
  group: adipredictor-data-writer-main
  cancel-in-progress: false

jobs:
  collect-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Collector Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytest

      - name: Parser Unit Tests
        run: python -m pytest -q tests/test_collector.py

      - name: Collect Latest Results
        env:
          MARKET: ${{ github.event.inputs.market || 'ALL' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; }; then
            python scripts/collector.py --market "$MARKET" --strict
          else
            python scripts/collector.py --market "$MARKET"
          fi

      - name: Generate P1-P8 Predictions
        run: python scripts/prediction_engine.py

      - name: Show Collector Diff
        run: |
          git status --short
          git diff -- public/data/hk.json public/data/sgp.json public/data/sdy.json public/data/collector-status.json || true

      - name: Commit New Results To Main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add public/data/hk.json public/data/sgp.json public/data/sdy.json
          git add public/data/collector-status.json
          git add public/predictions

          if git diff --cached --quiet; then
            echo "Tidak ada result/prediksi baru. Tidak membuat commit."
            exit 0
          fi
          git commit -m "data: auto-update verified lottery results [skip ci]"
          git push
