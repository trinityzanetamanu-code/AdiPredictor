name: Auto Result Collector

on:
  schedule:
    # Scheduled workflows run from the default branch after this PR is merged.
    - cron: '*/30 * * * *'
  push:
    branches:
      - 'feature/**'
    paths:
      - 'scripts/collector.py'
      - 'config/collector_sources.json'
      - 'tests/**'
      - '.github/workflows/auto-scraper.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/collector.py'
      - 'config/collector_sources.json'
      - 'tests/**'
      - '.github/workflows/auto-scraper.yml'
  workflow_dispatch:
    inputs:
      market:
        description: 'Market yang ingin dicek'
        required: false
        default: 'ALL'
        type: choice
        options:
          - ALL
          - HK
          - SGP
          - SDY

permissions:
  contents: write

concurrency:
  group: adipredictor-result-collector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-results:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Collector Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Parser Unit Tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Collect Latest Results
        env:
          MARKET: ${{ github.event.inputs.market || 'ALL' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/collector.py --market "$MARKET" --strict
          else
            python scripts/collector.py --market "$MARKET"
          fi

      - name: Show Collector Diff During Validation
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          git status --short
          git diff -- public/data/hk.json public/data/sgp.json public/data/sdy.json public/data/collector-status.json || true

      - name: Commit New Results Only
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add public/data/hk.json public/data/sgp.json public/data/sdy.json

          if git diff --cached --quiet; then
            echo "Tidak ada result baru. Tidak membuat commit."
            exit 0
          fi

          git add public/data/collector-status.json
          git commit -m "data: auto-update latest lottery results [skip ci]"
          git push
