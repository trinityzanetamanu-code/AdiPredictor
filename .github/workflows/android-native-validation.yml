name: Android Native Validation
on:
  push:
    branches: [main]
    paths: ['android-native/**', '.github/workflows/android-native-validation.yml', '.github/workflows/android-native-candidate.yml', 'scripts/native_candidate.py', 'scripts/android/LegacyExport*.java', 'scripts/configure_legacy_export.mjs', 'tests/test_native_candidate.py', 'public/data/**', 'public/predictions/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-native-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Freeze protected production input hashes
        run: python3 android-native/scripts/verify_protected_inputs.py --capture android-native/data/build/reports/protected-before.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install explicit SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: JVM data and contract tests
        working-directory: android-native
        run: ./gradlew :data:test --no-daemon --console=plain
      - name: Controlled Android UI, lifecycle and notification tests
        timeout-minutes: 8
        working-directory: android-native
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --console=plain
      - name: Lint and unsigned release compile
        working-directory: android-native
        run: ./gradlew :app:lintRelease :app:assembleRelease --no-daemon --console=plain
      - name: Verify release is unsigned
        run: |
          test -f android-native/app/build/outputs/apk/release/app-release-unsigned.apk
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android-native/app/build/outputs/apk/release/app-release-unsigned.apk; then
            echo 'Unexpected signing on native preview' >&2
            exit 1
          fi
      - name: Verify production inputs unchanged
        if: always()
        run: python3 android-native/scripts/verify_protected_inputs.py --compare android-native/data/build/reports/protected-before.json --report android-native/data/build/reports/protected-inputs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation-${{ github.sha }}
          path: |
            android-native/**/build/reports/
            android-native/**/build/test-results/
          if-no-files-found: error
