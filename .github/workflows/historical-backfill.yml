name: Historical Archive Backfill

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/historical_backfill.py'
      - 'data/reference/**'
      - '.github/workflows/historical-backfill.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adipredictor-data-writer-main
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup JVM for prediction adapter
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.16+8'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Backfill and Publish With Safe Retry
        env:
          INCLUDE_COLLECTOR: '0'
          INCLUDE_BACKFILL: '1'
          PREDICTION_FORCE: '0'
          MAX_PUSH_ATTEMPTS: '3'
        run: bash scripts/publish_generated_data.sh

      - name: Show Archive Summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for market in ('hk','sgp','sdy'):
              rows=json.loads(Path(f'public/data/{market}.json').read_text())
              print(market.upper(), len(rows), rows[-1]['result_date'], '->', rows[0]['result_date'])
          print(Path('public/data/historical-verification.json').read_text())
          PY

      - name: Upload executor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-executor-${{ github.run_id }}
          if-no-files-found: warn
          path: prediction-run-reports/
